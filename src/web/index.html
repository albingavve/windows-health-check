<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PC Health Dashboard</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header>
    <h1>PC Health Dashboard</h1>
    <p class="subtitle">Live system stats — updates every 2 seconds</p>
  </header>

  <main class="grid">
    <section class="card">
      <h2>CPU</h2>
      <p class="stat" id="cpu-value">--%</p>
      <canvas id="cpu-chart"></canvas>
    </section>

    <section class="card">
      <h2>Memory</h2>
      <p class="stat" id="mem-value">--%</p>
      <canvas id="mem-chart"></canvas>
    </section>

    <section class="card">
      <h2>Disk</h2>
      <p class="stat" id="disk-value">--%</p>
    </section>

    <section class="card">
      <h2>Network (cumulative)</h2>
      <p class="stat" id="net-value">-- / -- MB</p>
    </section>
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
