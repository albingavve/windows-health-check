<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PC Health Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header>
    <h1>PC Health Dashboard</h1>
    <p class="subtitle">Live system stats — updates every 2 seconds</p>
  </header>

  <main class="grid">
    <section class="card">
      <h2>CPU</h2>
      <div class="gauge-face">
        <canvas id="cpu-chart"></canvas>
        <p class="stat" id="cpu-value">--%</p>
      </div>
    </section>

    <section class="card">
      <h2>Memory</h2>
      <div class="gauge-face">
        <canvas id="mem-chart"></canvas>
        <p class="stat" id="mem-value">--%</p>
      </div>
    </section>

    <section class="card">
      <h2>Disk</h2>
      <p class="stat" id="disk-value">--%</p>
    </section>

    <section class="card">
      <h2>Network (cumulative)</h2>
      <p class="stat" id="net-value">-- / -- MB</p>
    </section>
  </main>

  <section class="panel">
    <div class="card startup-audit">
      <div class="startup-audit-header">
        <h2>Startup &amp; Services Audit</h2>
        <input
          type="search"
          id="startup-search"
          class="search-input"
          placeholder="Filter by name, source, or command…"
          autocomplete="off"
        />
      </div>
      <p class="muted-note" id="startup-count"></p>
      <div class="table-scroll">
        <table class="startup-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Source</th>
              <th>Command</th>
              <th>Impact</th>
              <th>Enabled</th>
            </tr>
          </thead>
          <tbody id="startup-table-body">
            <tr><td colspan="5" class="muted-note">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <script src="/assets/app.js"></script>
</body>
</html>
